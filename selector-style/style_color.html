        // HEX 색상의 밝기(Luminance)를 계산하여 스와치 내부 아이콘 대비 색상 결정
        function getContrastColor(hex) {
            if (!hex || !hex.startsWith('#') || hex.length < 7) return '#ffffff';
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return yiq >= 145 ? '#09090b' : '#ffffff';
        }

        // 클립보드 복사 함수 (navigator.clipboard.writeText 우선 사용 및 폴백)
        async function copyToClipboard(text, colorHex = '#ffffff') {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.opacity = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }
                showToast(text, colorHex);
            } catch (err) {
                // iFrame 제한 환경 등을 대비한 안전한 폴백 처리
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast(text, colorHex);
            }
        }

        // 토스트 메시지 표시 (1.8초 후 자동 숨김)
        function showToast(copiedText, colorHex) {
            const toast = document.getElementById('toast-notification');
            const toastText = document.getElementById('toast-text');
            const toastDot = document.getElementById('toast-color-dot');

            toastText.textContent = copiedText.includes('Mode') || copiedText.includes('Restored')
                ? copiedText
                : `Copied: ${copiedText}`;
            toastDot.style.backgroundColor = colorHex && colorHex.startsWith('#') ? colorHex : '#6366f1';

            toast.classList.remove('translate-y-12', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-12', 'opacity-0');
            }, 1800);
        }

        // 팔레트의 토큰 값을 추출하는 헬퍼
        function getTokenMap(palette) {
            const map = {};
            palette.tokens.forEach(t => {
                map[t.key] = t.hex;
            });
            return {
                bg: map['--bg'] || '#0a0a0a',
                fg: map['--fg'] || '#ffffff',
                accent: map['--accent'] || '#3b82f6',
                fourth: map['--muted'] || map['--border'] || map['--danger'] || map['--secondary'] || map['--surface'] || '#737373',
                fourthKey: palette.tokens[2]?.key || '--muted',
                fourthVal: palette.tokens[3]?.hex || map['--accent']
            };
        }

        // 각 테마의 특성을 살린 미니 프리뷰 카드 HTML 생성
        function generateMiniPreviewHTML(palette) {
            const t0 = palette.tokens[0].hex; // --bg
            const t1 = palette.tokens[1].hex; // --fg
            const t2 = palette.tokens[2].hex; // 3번째 토큰 (--muted, --border, --accent, --surface 등)
            const t3 = palette.tokens[3].hex; // 4번째 토큰 (--accent, --danger, --secondary 등)

            const bg = t0;
            const fg = t1;
            const accent = palette.tokens.find(t => t.key === '--accent')?.hex || t3;
            const subColor = palette.tokens.find(t => ['--muted', '--border', '--surface'].includes(t.key))?.hex || t2;
            const extraColor = palette.tokens.find(t => ['--danger', '--secondary'].includes(t.key))?.hex || accent;

            const btnTextContrast = getContrastColor(accent);
            const isBrutal = palette.id === 6;
            const isNeon = palette.id === 7;
            const isTerminal = palette.id === 3;
            const isQuant = palette.id === 4;

            return `
                <div id="preview-box-${palette.id}" 
                     class="rounded-xl p-5 transition-colors duration-200 flex flex-col justify-between h-full min-h-[210px] relative overflow-hidden"
                     style="background-color: ${bg}; color: ${fg}; border: ${isBrutal ? `3px solid ${fg}` : `1px solid ${subColor}55`}; ${isBrutal ? `box-shadow: 5px 5px 0px ${fg};` : ''}">
                    
                    <!-- 상단 상태 표시줄 -->
                    <div class="flex items-center justify-between gap-2 pb-3" style="border-bottom: 1px solid ${subColor}40;">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${accent}; ${isNeon ? `box-shadow: 0 0 10px ${accent};` : ''}"></span>
                            <span class="text-xs font-mono font-semibold tracking-tight" style="color: ${fg};">${palette.previewTitle}</span>
                        </div>
                        <span class="text-[10px] font-mono px-2 py-0.5 rounded" 
                              style="background-color: ${extraColor}22; color: ${extraColor}; border: 1px solid ${extraColor}55;">
                            LIVE
                        </span>
                    </div>

                    <!-- 중앙 메인 지표 및 텍스트 상자 -->
                    <div class="my-4 space-y-2.5">
                        <div class="flex items-baseline justify-between">
                            <div class="text-2xl font-bold tracking-tight ${isTerminal ? 'font-mono' : ''}" 
                                 style="color: ${fg}; ${isNeon ? `text-shadow: 0 0 12px ${accent}66;` : ''}">
                                ${palette.previewMetric}
                            </div>
                            ${isQuant ? `
                                <div class="flex items-center gap-1 text-[11px] font-mono">
                                    <span class="px-1.5 py-0.5 rounded" style="background:${accent}25; color:${accent};">BUY</span>
                                    <span class="px-1.5 py-0.5 rounded" style="background:${extraColor}25; color:${extraColor};">SELL</span>
                                </div>
                            ` : `
                                <span class="text-xs font-mono" style="color: ${accent};">▲ +2.4%</span>
                            `}
                        </div>

                        <p class="text-xs leading-relaxed opacity-80" style="color: ${subColor === accent ? fg : subColor};">
                            ${palette.previewSub}
                        </p>

                        <!-- 미니 입력창(텍스트 상자) 프리뷰 -->
                        <div class="flex items-center gap-2 pt-1">
                            <input type="text" 
                                   readonly 
                                   value="${palette.tokens.map(tok => tok.key).join(' • ')}"
                                   class="w-full text-xs font-mono px-2.5 py-1.5 rounded focus:outline-none cursor-default"
                                   style="background-color: ${fg}0d; color: ${fg}; border: ${isBrutal ? `2px solid ${fg}` : `1px solid ${subColor}66`};" />
                        </div>
                    </div>

                    <!-- 하단 액션 버튼 & 보조 배지 -->
                    <div class="flex items-center justify-between gap-2 pt-2">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 rounded-sm inline-block" style="background-color: ${t2}; border: 1px solid ${fg}33;"></span>
                            <span class="w-3 h-3 rounded-sm inline-block" style="background-color: ${t3}; border: 1px solid ${fg}33;"></span>
                            <span class="text-[11px] font-mono opacity-75" style="color: ${fg};">${palette.name}</span>
                        </div>
                        <button type="button"
                                onclick="copyPaletteCSS(${palette.id})"
                                class="px-3.5 py-1.5 rounded-md text-xs font-semibold transition-transform active:scale-95"
                                style="background-color: ${accent}; color: ${btnTextContrast}; ${isBrutal ? `border: 2px solid ${fg}; box-shadow: 2px 2px 0px ${fg};` : ''} ${isNeon ? `box-shadow: 0 0 14px ${accent}88;` : ''}">
                            ${palette.previewBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        // 전체 팔레트 대시보드 렌더링
        function renderPalettes() {
            const container = document.getElementById('palette-container');
            const filtered = palettes.filter(p => currentFilter === 'all' ? true : p.mode === currentFilter);

            container.innerHTML = filtered.map(palette => {
                const cssString = palette.tokens.map(t => `${t.key}: ${t.hex};`).join(' ');

                return `
                <section class="rounded-2xl bg-panel border border-borderSubtle p-5 sm:p-6 transition-all hover:border-zinc-700/80 shadow-xl shadow-black/40">
                    <!-- 카드 상단 메타 정보 헤더 -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-5 mb-5 border-b border-zinc-800/80">
                        <div>
                            <div class="flex flex-wrap items-center gap-2.5">
                                <span class="font-mono text-xs font-semibold px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-zinc-700">
                                    #${String(palette.id).padStart(2, '0')}
                                </span>
                                <h2 class="text-lg sm:text-xl font-bold text-white tracking-tight">${palette.name}</h2>
                                <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full ${palette.mode === 'light' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30' : 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/30'}">
                                    ${palette.mode === 'light' ? '☀ Light Theme' : '☾ Dark Theme'}
                                </span>
                                <span class="text-xs text-zinc-400 font-mono hidden md:inline">• ${palette.badge}</span>
                            </div>
                            <p class="text-xs sm:text-sm text-zinc-400 mt-1.5">
                                ${palette.description}
                            </p>
                        </div>

                        <!-- 전체 CSS 변수 복사 버튼 -->
                        <div class="flex items-center gap-2 self-start sm:self-center flex-shrink-0">
                            <button onclick="copyPaletteCSS(${palette.id})" 
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-mono bg-zinc-800/90 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 transition-all active:scale-95">
                                <i data-lucide="code-2" class="w-3.5 h-3.5 text-indigo-400"></i>
                                <span>Copy CSS Vars</span>
                            </button>
                        </div>
                    </div>

                    <!-- 본문: 좌측 4개 컬러 스와치 카드 + 우측 미니 UI 프리뷰 카드 -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                        
                        <!-- 컬러 스와치 그리드 (4열) -->
                        <div class="lg:col-span-7 grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                            ${palette.tokens.map((token, idx) => {
                    const contrast = getContrastColor(token.hex);
                    return `
                                <div class="group flex flex-col rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900/60 hover:border-zinc-600 transition-all shadow-md">
                                    
                                    <!-- 크게 노출된 컬러 스와치 박스 (클릭 시 HEX Color Picker 오픈) -->
                                    <label class="relative h-28 sm:h-32 w-full block cursor-pointer bg-checkerboard overflow-hidden" title="클릭하여 색상 변경 (${token.key})">
                                        <div id="swatch-bg-${palette.id}-${idx}" 
                                             class="w-full h-full transition-colors duration-150 flex flex-col justify-between p-2.5"
                                             style="background-color: ${token.hex};">
                                            
                                            <div class="flex items-center justify-between">
                                                <span id="swatch-tag-${palette.id}-${idx}"
                                                      class="text-[10px] font-mono font-semibold px-1.5 py-0.5 rounded backdrop-blur-sm bg-black/20"
                                                      style="color: ${contrast};">
                                                    ${token.key}
                                                </span>
                                                <span id="swatch-icon-${palette.id}-${idx}"
                                                      class="opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded-md bg-black/25 backdrop-blur-sm"
                                                      style="color: ${contrast};">
                                                    <i data-lucide="pipette" class="w-3.5 h-3.5"></i>
                                                </span>
                                            </div>

                                            <div id="swatch-hint-${palette.id}-${idx}" 
                                                 class="text-[10px] font-medium opacity-0 group-hover:opacity-90 transition-opacity tracking-tight"
                                                 style="color: ${contrast};">
                                                Click to pick color
                                            </div>
                                        </div>

                                        <!-- 네이티브 HTML5 Color Picker -->
                                        <input type="color" 
                                               value="${token.hex}" 
                                               oninput="handleColorChange(${palette.id}, ${idx}, this.value)"
                                               class="swatch-color-input" />
                                    </label>

                                    <!-- 하단 메타 및 HEX 코드 텍스트 (클릭 시 즉시 클립보드 복사) -->
                                    <div class="p-3 flex flex-col justify-between flex-1 bg-zinc-950/70">
                                        <div class="text-[11px] text-zinc-400 font-medium truncate mb-1" title="${token.label}">
                                            ${token.label}
                                        </div>
                                        
                                        <button type="button"
                                                onclick="copyToClipboard(document.getElementById('hex-text-${palette.id}-${idx}').textContent, document.getElementById('hex-text-${palette.id}-${idx}').textContent)"
                                                class="w-full flex items-center justify-between gap-1 px-2.5 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 hover:border-zinc-700 text-left transition-all group/hex active:scale-95"
                                                title="클릭하여 HEX 코드 복사">
                                            <span id="hex-text-${palette.id}-${idx}" class="font-mono text-xs sm:text-sm font-semibold text-zinc-100 tracking-wider uppercase">
                                                ${token.hex}
                                            </span>
                                            <i data-lucide="copy" class="w-3.5 h-3.5 text-zinc-500 group-hover/hex:text-indigo-400 transition-colors flex-shrink-0"></i>
                                        </button>

                                        ${token.displayValue ? `
                                            <div onclick="copyToClipboard('${token.displayValue}', '${token.hex}')"
                                                 class="mt-1.5 text-[10px] font-mono text-sky-400/90 hover:text-sky-300 truncate cursor-pointer"
                                                 title="원본 RGBA 값 복사: ${token.displayValue}">
                                                ${token.displayValue}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                                `;
                }).join('')}
                        </div>

                        <!-- 우측 미니 UI 프리뷰 카드 영역 -->
                        <div class="lg:col-span-5 flex flex-col">
                            <div id="preview-wrapper-${palette.id}" class="flex-1">
                                ${generateMiniPreviewHTML(palette)}
                            </div>
                        </div>

                    </div>
                </section>
                `;
            }).join('');

            // Lucide 아이콘 초기화
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // 컬러 피커 조작 시 스와치 배경, HEX 텍스트, 미니 프리뷰를 즉시 업데이트
        function handleColorChange(paletteId, tokenIndex, newHex) {
            const formattedHex = newHex.toLowerCase();
            const palette = palettes.find(p => p.id === paletteId);
            if (!palette) return;

            // 상태 업데이트
            palette.tokens[tokenIndex].hex = formattedHex;

            // 스와치 박스 배경 및 대비 텍스트 컬러 즉시 업데이트
            const swatchBg = document.getElementById(`swatch-bg-${paletteId}-${tokenIndex}`);
            const swatchTag = document.getElementById(`swatch-tag-${paletteId}-${tokenIndex}`);
            const swatchIcon = document.getElementById(`swatch-icon-${paletteId}-${tokenIndex}`);
            const swatchHint = document.getElementById(`swatch-hint-${paletteId}-${tokenIndex}`);
            const hexText = document.getElementById(`hex-text-${paletteId}-${tokenIndex}`);

            const contrast = getContrastColor(formattedHex);

            if (swatchBg) swatchBg.style.backgroundColor = formattedHex;
            if (swatchTag) swatchTag.style.color = contrast;
            if (swatchIcon) swatchIcon.style.color = contrast;
            if (swatchHint) swatchHint.style.color = contrast;
            if (hexText) hexText.textContent = formattedHex;

            // 해당 테마의 미니 프리뷰 카드 즉시 리렌더링
            const previewWrapper = document.getElementById(`preview-wrapper-${paletteId}`);
            if (previewWrapper) {
                previewWrapper.innerHTML = generateMiniPreviewHTML(palette);
            }
        }

        // 특정 팔레트의 전체 CSS 변수 선언문 복사
        function copyPaletteCSS(paletteId) {
            const palette = palettes.find(p => p.id === paletteId);
            if (!palette) return;
            const cssVars = palette.tokens.map(t => `${t.key}: ${t.hex};`).join(' ');
            const accentHex = palette.tokens.find(t => t.key === '--accent')?.hex || palette.tokens[0].hex;
            copyToClipboard(cssVars, accentHex);
        }

        // 다크/라이트 테마 필터링
        function filterPalettes(mode) {
            currentFilter = mode;
            const buttons = ['all', 'dark', 'light'];
            buttons.forEach(btn => {
                const el = document.getElementById(`filter-${btn}`);
                if (btn === mode) {
                    el.className = "filter-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all bg-zinc-800 text-white shadow-sm";
                } else {
                    el.className = "filter-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-zinc-400 hover:text-white";
                }
            });
            renderPalettes();
        }

        // 모든 팔레트 색상을 초기 프리셋으로 복원
        function resetAllPalettes() {
            palettes = JSON.parse(JSON.stringify(INITIAL_PALETTES));
            renderPalettes();
            showToast("All Presets Restored", "#10b981");
        }

        // Dark / Light Theme Toggle
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            }

            const toggleBtn = document.getElementById('themeToggleBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const isDark = document.documentElement.classList.toggle('dark');
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                    showToast(isDark ? 'Dark Mode Enabled' : 'Light Mode Enabled', '#6366f1');
                });
            }
        }

        initTheme();

        // 초기 실행
        window.addEventListener('DOMContentLoaded', () => {
            renderPalettes();
        });
    </script>
</body>

</html>
