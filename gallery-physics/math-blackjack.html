<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Blackjack Pro</title>
<style>
body{margin:0;font-family:Arial;background:radial-gradient(circle,#0b5d3b,#052e1d);color:#fff;text-align:center}
h1{margin:10px}
.table{padding:20px}
.hand{margin:20px}
.cards{display:flex;justify-content:center;gap:10px}
.card{width:70px;height:100px;border-radius:10px;background:#fff;color:#000;display:flex;flex-direction:column;justify-content:space-between;padding:5px;font-weight:bold;box-shadow:0 6px 12px rgba(0,0,0,.5)}
.red{color:#c0392b}
.controls button{margin:5px;padding:10px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.hit{background:#3498db;color:#fff}
.stand{background:#e67e22}
.double{background:#9b59b6}
.start{background:#2ecc71}
#chips{margin-top:10px}
</style>
</head>
<body>
<h1>Blackjack</h1>
<div id="chips">Chips: <span id="balance">1000</span></div>

<div class="table">
<div class="hand">
<h2>Dealer (<span id="dealer-score">?</span>)</h2>
<div id="dealer-cards" class="cards"></div>
</div>

<div class="hand">
<h2>You (<span id="player-score">0</span>)</h2>
<div id="player-cards" class="cards"></div>
</div>

<div class="controls">
<button class="start" onclick="startGame()">Deal</button>
<button class="hit" onclick="hit()">Hit</button>
<button class="stand" onclick="stand()">Stand</button>
<button class="double" onclick="doubleDown()">Double</button>
</div>

<div id="result"></div>
</div>

<script>
const suits=['♠','♥','♦','♣'];
let deck=[],player=[],dealer=[];
let balance=1000,bet=100,gameOver=false,hidden=true;

function buildDeck(){
 deck=[];
 for(let s of suits){
  for(let v=1;v<=13;v++) deck.push({s,v});
 }
 deck=deck.sort(()=>Math.random()-0.5);
}

function draw(){return deck.pop()}

function val(c){if(c.v>10)return 10;if(c.v===1)return 11;return c.v}

function score(hand){
 let t=0,a=0;
 hand.forEach(c=>{t+=val(c);if(c.v===1)a++});
 while(t>21&&a>0){t-=10;a--}
 return t;
}

function render(id,hand,hideFirst=false){
 const el=document.getElementById(id);el.innerHTML='';
 hand.forEach((c,i)=>{
  const d=document.createElement('div');
  d.className='card '+((c.s==='♥'||c.s==='♦')?'red':'');
  if(i===0&&hideFirst){d.innerHTML='?';}
  else{
   const label=c.v===1?'A':c.v>10?['J','Q','K'][c.v-11]:c.v;
   d.innerHTML=`<div>${label}</div><div>${c.s}</div>`;
  }
  el.appendChild(d);
 });
}

function update(){
 render('player-cards',player);
 render('dealer-cards',dealer,hidden);
 document.getElementById('player-score').innerText=score(player);
 document.getElementById('dealer-score').innerText=hidden?'?':score(dealer);
 document.getElementById('balance').innerText=balance;
}

function startGame(){
 if(balance<bet)return alert('잔액 부족');
 buildDeck();
 player=[draw(),draw()];
 dealer=[draw(),draw()];
 gameOver=false;hidden=true;
 document.getElementById('result').innerText='';
 update();
 if(score(player)===21) endGame();
}

function hit(){
 if(gameOver)return;
 player.push(draw());
 if(score(player)>21) endGame();
 update();
}

function stand(){
 if(gameOver)return;
 hidden=false;
 while(score(dealer)<17) dealer.push(draw());
 endGame();
}

function doubleDown(){
 if(gameOver)return;
 if(balance<bet)return;
 bet*=2;
 player.push(draw());
 hidden=false;
 while(score(dealer)<17) dealer.push(draw());
 endGame();
}

function endGame(){
 gameOver=true;hidden=false;
 const p=score(player),d=score(dealer);
 let res='';
 if(p>21){res='LOSE';balance-=bet}
 else if(d>21||p>d){res=(p===21&&player.length===2)?'BLACKJACK':'WIN';balance+=bet*(res==='BLACKJACK'?1.5:1)}
 else if(p<d){res='LOSE';balance-=bet}
 else res='PUSH';
 document.getElementById('result').innerText=res;
 bet=100;
 update();
}
</script>
</body>
</html>
