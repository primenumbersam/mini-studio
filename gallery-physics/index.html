<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Gallery (Glassmorphism style)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap');

        :root {
            --text-color: #f0f0f0;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.25);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
            background-color: #0d0d0d;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 50%, #8A2BE2, transparent 40%),
                radial-gradient(circle at 85% 30%, #4169E1, transparent 40%),
                radial-gradient(circle at 70% 80%, #FF69B4, transparent 40%);
            filter: blur(100px);
            animation: backgroundAnimation 20s ease-in-out infinite;
        }

        @keyframes backgroundAnimation {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(20px, -20px) scale(1.2);
            }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            text-shadow: 0 2px 4px var(--shadow-color);
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 1.5rem 0;
            font-size: 0.85rem;
            opacity: 0.6;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 500;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(max(220px, calc((100% - 3 * 2.5rem) / 4)), 1fr));
            gap: 2.5rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--glass-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
        }

        .card .cover {
            width: 100%;
            height: 240px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            object-fit: cover;
            margin-bottom: 1rem;
        }

        .card .title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .card .domain,
        .card .author {
            font-size: 0.9rem;
            font-weight: 300;
            margin-bottom: 0.75rem;
        }

        .card hr {
            border: none;
            height: 1px;
            background-color: var(--glass-border);
            margin: 0.75rem 1rem;
        }

        .card .date {
            font-size: 0.8rem;
            font-weight: 300;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <header>
        <h1>Physics Simulation</h1>
    </header>

    <main id="container">
        <div class="card-grid" id="cardGrid"></div>
    </main>

        const cardGrid = document.getElementById("cardGrid");
        cardGrid.innerHTML = cardsData.map(card => `
            <a href="${card.link}" class="card">
                <img class="cover" src="${card.image}" alt="Cover of ${card.title}">
                <div class="info">
                    <h3 class="title">${card.title}</h3>
                    <p class="domain">${card.domain}</p>
                    <hr>
                    <p class="date">created: ${card.date}</p>
                </div>
            </a>
        `).join("");

        VanillaTilt.init(document.querySelectorAll(".card"), {
            max: 15,
            speed: 400,
            glare: true,
            "max-glare": 0.15,
            perspective: 1200,
            scale: 1.03,
        });

    <footer>
        <p>삼순동순 아티스트</p>
    </footer>
</body>

</html>
