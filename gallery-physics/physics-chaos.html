<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lorenz Attractor - RK4 Solver & 3D Projection</title>
  <style>
    :root { color-scheme: dark; --bg: #0a0a0f; --panel: #111118; --border: #2a2a3a; --text: #e0e0f0; --accent: #60a5fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.2rem; margin: 0 0 12px 0; }
    .grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    canvas { display: block; width: 100%; height: 600px; background: #050508; border: 1px solid var(--border); border-radius: 8px; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.78rem; color: #94a3b8; font-weight: 600; display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .badge { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--accent); }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: #1e293b; color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    button:hover { background: #334155; }
    button.primary { background: var(--accent); color: #000; border: none; }
    .stats { font-family: ui-monospace, monospace; font-size: 0.72rem; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; background: #0d0d14; padding: 10px; border-radius: 6px; }
    .note { font-size: 0.72rem; color: #64748b; line-height: 1.5; }
    .color-row { display: flex; gap: 8px; align-items: center; }
    .color-row input[type=color] { width: 32px; height: 24px; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Lorenz Attractor: Runge-Kutta 4th Order Solver & 3D Projection</h1>
  <div class="grid">
    <!-- Canvas -->
    <canvas id="cv"></canvas>

    <!-- Control Panel -->
    <div class="panel">
      <div class="row">
        <label>σ (Sigma) <span class="badge" id="sigmaVal">10.0</span></label>
        <input type="range" id="sigmaRange" min="1" max="20" step="0.1" value="10">
      </div>
      <div class="row">
        <label>ρ (Rho) <span class="badge" id="rhoVal">28.0</span></label>
        <input type="range" id="rhoRange" min="1" max="50" step="0.1" value="28">
      </div>
      <div class="row">
        <label>β (Beta) <span class="badge" id="betaVal">2.67</span></label>
        <input type="range" id="betaRange" min="0.5" max="5" step="0.01" value="2.6667">
      </div>
      <div class="row">
        <label>Time Step (dt) <span class="badge" id="dtVal">0.005</span></label>
        <input type="range" id="dtRange" min="0.001" max="0.02" step="0.001" value="0.005">
      </div>
      <div class="row">
        <label>Trail Length <span class="badge" id="trailVal">8000</span></label>
        <input type="range" id="trailRange" min="1000" max="20000" step="500" value="8000">
      </div>
      <div class="row">
        <label>Zoom <span class="badge" id="zoomVal">12</span></label>
        <input type="range" id="zoomRange" min="5" max="25" step="0.5" value="12">
      </div>
      <div class="row">
        <label>Auto-Rotate Speed <span class="badge" id="rotVal">0.002</span></label>
        <input type="range" id="rotRange" min="0" max="0.01" step="0.0005" value="0.002">
      </div>
      <div class="color-row">
        <label style="flex:1">Start Color</label>
        <input type="color" id="colorStart" value="#3b82f6">
        <label style="flex:1">End Color</label>
        <input type="color" id="colorEnd" value="#f472b6">
      </div>

      <div class="btns">
        <button id="resetBtn">Reset</button>
        <button id="pauseBtn" class="primary">Pause</button>
      </div>

      <div class="stats" id="stats">Loading...</div>

      <div class="note">
        <b>Drag</b> to rotate manually.<br>
        <b>Chaos:</b> 초기값에 극도로 민감한 결정론적 시스템.<br>
        ρ ≈ 24.74 이상에서 로렌츠 끌개가 나타남.
      </div>
    </div>
  </div>
</div>

<script>
/**
 * Lorenz Attractor Visualization
 * - Solver: Runge-Kutta 4th order (RK4), O(h^4) local error.
 * - Render: 3D → 2D projection with rotation, fade trail.
 * - Complexity per frame: O(trailLen) for drawing.
 */

(() => {
  // === Canvas Setup ===
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W, H;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = cv.getBoundingClientRect();
    W = Math.floor(rect.width * dpr);
    H = Math.floor(rect.height * dpr);
    cv.width = W;
    cv.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  // === Parameters (Lorenz system constants) ===
  let sigma = 10;
  let rho = 28;
  let beta = 8 / 3;
  let dt = 0.005;
  let trailLen = 8000;
  let zoom = 12;
  let autoRotSpeed = 0.002;
  let colorStart = '#3b82f6';
  let colorEnd = '#f472b6';

  // === State ===
  let state = { x: 0.1, y: 0, z: 0 }; // Initial condition (sensitive!)
  let trail = []; // Array of {x, y, z}
  let running = true;

  // Camera angles (spherical coords for rotation)
  let angleX = 0.3; // pitch
  let angleY = 0;   // yaw (auto-rotated)

  // === Runge-Kutta 4th Order Solver ===
  /**
   * Computes derivatives dx/dt, dy/dt, dz/dt for Lorenz system.
   * @param {number} x
   * @param {number} y
   * @param {number} z
   * @returns dx: number, dy: number, dz: number
   */
  function lorenz(x, y, z) {
    return {
      dx: sigma * (y - x),
      dy: x * (rho - z) - y,
      dz: x * y - beta * z
    };
  }

  /**
   * Performs one RK4 integration step.
   * Complexity: O(1) per step.
   * @param x: number, y: number, z: number s - current state
   * @param {number} h - time step
   * @returns x: number, y: number, z: number - next state
   */
  function rk4Step(s, h) {
    // k1 = f(t, y)
    const k1 = lorenz(s.x, s.y, s.z);

    // k2 = f(t + h/2, y + h*k1/2)
    const k2 = lorenz(
      s.x + h * k1.dx / 2,
      s.y + h * k1.dy / 2,
      s.z + h * k1.dz / 2
    );

    // k3 = f(t + h/2, y + h*k2/2)
    const k3 = lorenz(
      s.x + h * k2.dx / 2,
      s.y + h * k2.dy / 2,
      s.z + h * k2.dz / 2
    );

    // k4 = f(t + h, y + h*k3)
    const k4 = lorenz(
      s.x + h * k3.dx,
      s.y + h * k3.dy,
      s.z + h * k3.dz
    );

    // Weighted average: y_next = y + h/6 * (k1 + 2*k2 + 2*k3 + k4)
    return {
      x: s.x + (h / 6) * (k1.dx + 2 * k2.dx + 2 * k3.dx + k4.dx),
      y: s.y + (h / 6) * (k1.dy + 2 * k2.dy + 2 * k3.dy + k4.dy),
      z: s.z + (h / 6) * (k1.dz + 2 * k2.dz + 2 * k3.dz + k4.dz)
    };
  }

  // === 3D Projection ===
  /**
   * Projects 3D point to 2D screen using rotation and orthographic projection.
   * Rotation order: Y (yaw) then X (pitch).
   * @param {number} x
   * @param {number} y
   * @param {number} z
   * @returns sx: number, sy: number
   */
  function project(x, y, z) {
    // Center the attractor (Lorenz has wings around z≈27)
    const cx = 0, cy = 0, cz = 25;
    let px = x - cx;
    let py = y - cy;
    let pz = z - cz;

    // Rotate around Y-axis (yaw)
    const cosY = Math.cos(angleY);
    const sinY = Math.sin(angleY);
    let rx = px * cosY - pz * sinY;
    let rz = px * sinY + pz * cosY;
    px = rx;
    pz = rz;

    // Rotate around X-axis (pitch)
    const cosX = Math.cos(angleX);
    const sinX = Math.sin(angleX);
    let ry = py * cosX - pz * sinX;
    rz = py * sinX + pz * cosX;
    py = ry;
    pz = rz;

    // Orthographic projection (ignore depth for simplicity, or use for fading)
    const scale = zoom * (W / 800); // responsive scale
    const sx = W / 2 + px * scale;
    const sy = H / 2 - py * scale; // flip Y for canvas

    return { sx, sy, depth: pz };
  }

  // === Color Interpolation ===
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function lerpColor(t) {
    const c1 = hexToRgb(colorStart);
    const c2 = hexToRgb(colorEnd);
    const r = Math.round(c1.r + t * (c2.r - c1.r));
    const g = Math.round(c1.g + t * (c2.g - c1.g));
    const b = Math.round(c1.b + t * (c2.b - c1.b));
    return `rgb(${r},${g},${b})`;
  }

  // === Rendering ===
  function render() {
    // Clear with slight fade for motion blur effect (optional: use solid clear)
    ctx.fillStyle = 'rgba(5, 5, 8, 0.15)';
    ctx.fillRect(0, 0, W, H);

    if (trail.length < 2) return;

    // Draw trail as polyline segments with gradient color
    // Complexity: O(trailLen)
    ctx.lineWidth = 1.2 * (window.devicePixelRatio || 1);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 1; i < trail.length; i++) {
      const p0 = trail[i - 1];
      const p1 = trail[i];
      const pr0 = project(p0.x, p0.y, p0.z);
      const pr1 = project(p1.x, p1.y, p1.z);

      // Color gradient along trail (older = start color, newer = end color)
      const t = i / trail.length;
      ctx.strokeStyle = lerpColor(t);

      // Alpha based on age for fade effect
      ctx.globalAlpha = 0.3 + 0.7 * t;

      ctx.beginPath();
      ctx.moveTo(pr0.sx, pr0.sy);
      ctx.lineTo(pr1.sx, pr1.sy);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;

    // Draw current point (head)
    const head = trail[trail.length - 1];
    const hp = project(head.x, head.y, head.z);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(hp.sx, hp.sy, 3 * (window.devicePixelRatio || 1), 0, Math.PI * 2);
    ctx.fill();
  }

  // === Update Stats Display ===
  function updateStats() {
    const s = state;
    document.getElementById('stats').textContent =
      `State (RK4 solution):\n` +
      `  x = ${s.x.toFixed(4)}\n` +
      `  y = ${s.y.toFixed(4)}\n` +
      `  z = ${s.z.toFixed(4)}\n` +
      `Trail points: ${trail.length}\n` +
      `Camera: pitch=${(angleX * 180 / Math.PI).toFixed(1)}°, yaw=${(angleY * 180 / Math.PI).toFixed(1)}°`;
  }

  // === Main Loop ===
  function loop() {
    if (running) {
      // Perform multiple RK4 steps per frame for smoother trail
      const stepsPerFrame = 4;
      for (let i = 0; i < stepsPerFrame; i++) {
        state = rk4Step(state, dt);
        trail.push({ x: state.x, y: state.y, z: state.z });

        // Limit trail length (ring buffer behavior)
        if (trail.length > trailLen) trail.shift(); // O(n) but acceptable for interactive viz
      }

      // Auto-rotate camera
      angleY += autoRotSpeed;
    }

    render();
    updateStats();
    requestAnimationFrame(loop);
  }

  // === Reset ===
  function reset() {
    // Slightly perturbed initial condition (demonstrates chaos sensitivity)
    state = { x: 0.1 + Math.random() * 0.001, y: 0, z: 0 };
    trail = [];
  }

  // === Mouse Drag for Manual Rotation ===
  let dragging = false;
  let lastMouse = { x: 0, y: 0 };

  cv.addEventListener('mousedown', (e) => {
    dragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    angleY += dx * 0.005;
    angleX += dy * 0.005;
    // Clamp pitch to avoid flipping
    angleX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, angleX));
    lastMouse = { x: e.clientX, y: e.clientY };
  });

  // Touch support
  cv.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      dragging = true;
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  });
  window.addEventListener('touchend', () => dragging = false);
  window.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - lastMouse.x;
    const dy = e.touches[0].clientY - lastMouse.y;
    angleY += dx * 0.005;
    angleX += dy * 0.005;
    angleX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, angleX));
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });

  // === UI Bindings ===
  const bind = (id, valId, setter) => {
    const el = document.getElementById(id);
    const valEl = document.getElementById(valId);
    el.addEventListener('input', () => {
      const v = parseFloat(el.value);
      valEl.textContent = v.toFixed(id === 'dtRange' || id === 'rotRange' ? 3 : (id === 'betaRange' ? 2 : 1));
      setter(v);
    });
  };

  bind('sigmaRange', 'sigmaVal', v => sigma = v);
  bind('rhoRange', 'rhoVal', v => rho = v);
  bind('betaRange', 'betaVal', v => beta = v);
  bind('dtRange', 'dtVal', v => dt = v);
  bind('trailRange', 'trailVal', v => trailLen = v);
  bind('zoomRange', 'zoomVal', v => zoom = v);
  bind('rotRange', 'rotVal', v => autoRotSpeed = v);

  document.getElementById('colorStart').addEventListener('input', e => colorStart = e.target.value);
  document.getElementById('colorEnd').addEventListener('input', e => colorEnd = e.target.value);

  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('pauseBtn').addEventListener('click', (e) => {
    running = !running;
    e.target.textContent = running ? 'Pause' : 'Resume';
    e.target.classList.toggle('primary', running);
  });

  // === Start ===
  reset();
  loop();
})();
</script>
</body>
</html>
