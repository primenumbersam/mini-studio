<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econ & Quant Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f4ee;
            --surface: #ffffff;
            --ink: #111111;
            --muted: #52525b;
            --border-w: 2px;
            --shadow: 5px 5px 0px #111111;
            --shadow-hover: 8px 8px 0px #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#d4d0c5 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--ink);
            min-height: 100vh;
            padding: 2.5rem 1.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        header {
            max-width: 1180px;
            width: 100%;
            margin: 0 auto 2.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 1.25rem;
            border-bottom: 3px solid var(--ink);
        }

        .eyebrow {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: #fde047;
            border: 2px solid var(--ink);
            padding: 0.2rem 0.55rem;
            margin-bottom: 0.6rem;
            box-shadow: 2px 2px 0 var(--ink);
        }

        h1 {
            font-size: clamp(1.85rem, 3vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--muted);
        }

        main {
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.75rem;
        }

        @media (max-width: 960px) {
            .card-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 620px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: var(--border-w) solid var(--ink);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 1rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .card:hover {
            transform: translate(-3px, -3px);
            box-shadow: var(--shadow-hover);
        }

        .card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--ink);
        }

        .cover-wrap {
            width: 100%;
            aspect-ratio: 16 / 10;
            border: 2px solid var(--ink);
            border-radius: 6px;
            overflow: hidden;
            background: #e5e7eb;
            margin-bottom: 0.9rem;
        }

        .card .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }

        .card:hover .cover {
            transform: scale(1.03);
        }

        .info {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 0.45rem;
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card .title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .card .domain {
            display: inline-block;
            align-self: flex-start;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.18rem 0.5rem;
            border: 1.5px solid var(--ink);
            border-radius: 4px;
            background: var(--accent, #e0f2fe);
        }

        .card .meta-footer {
            margin-top: auto;
            padding-top: 0.65rem;
            border-top: 1.5px dashed #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .arrow {
            font-weight: 700;
            color: var(--ink);
        }

        footer {
            max-width: 1180px;
            width: 100%;
            margin: 3rem auto 0;
            padding-top: 1.25rem;
            border-top: 2px solid var(--ink);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header>
        <div>
            <span class="eyebrow">Interactive Hub</span>
            <h1>Economics &amp; Quant Gallery</h1>
        </div>
        <p class="subtitle">6 interactive models · macro · derivatives · networks</p>
    </header>

    <main>
        <div class="card-grid" id="cardGrid"></div>
    </main>

    <footer>
        <span>삼순동순 아티스트</span>
        <span>Neo-Brutalism Light</span>
    </footer>

    <script>
        const cardsData = [
            {
                title: "Macro Compass",
                domain: "macro cycle",
                accent: "#bae6fd",
                date: "2026-11-13",
                image: "assets/macro-compass.jpg",
                link: "macro-compass.html"
            },
            {
                title: "Macro Dynamics",
                domain: "system dynamics",
                accent: "#ddd6fe",
                date: "2026-11-13",
                image: "assets/macro-dynamics.jpg",
                link: "macro-dynamics.html"
            },
            {
                title: "Option Price Surface",
                domain: "quant derivatives",
                accent: "#a7f3d0",
                date: "2026-11-13",
                image: "assets/option-surface.jpg",
                link: "option-surface.html"
            },
            {
                title: "AI Supply Chain Network",
                domain: "industry graph",
                accent: "#fde047",
                date: "2026-10-22",
                image: "assets/chips-network.jpg",
                link: "chips-network.html"
            },
            {
                title: "AI Bubble Contagion",
                domain: "risk timeline",
                accent: "#fecdd3",
                date: "2026-10-16",
                image: "assets/chips-timeline.jpg",
                link: "chips-timeline.html"
            },
            {
                title: "Zero-Sum Prediction Market",
                domain: "game theory",
                accent: "#fed7aa",
                date: "2026-10-14",
                image: "assets/polymarket.jpg",
                link: "polymarket.html"
            }
        ];

        const cardGrid = document.getElementById("cardGrid");
        cardGrid.innerHTML = cardsData.map(card => `
            <a href="${card.link}" class="card" style="--accent: ${card.accent};">
                <div class="cover-wrap">
                    <img class="cover" src="${card.image}" alt="Cover of ${card.title}">
                </div>
                <div class="info">
                    <h3 class="title">${card.title}</h3>
                    <span class="domain">${card.domain}</span>
                    <div class="meta-footer">
                        <span>created: ${card.date}</span>
                        <span class="arrow">-&gt;</span>
                    </div>
                </div>
            </a>
        `).join("");
    </script>
</body>

</html>
