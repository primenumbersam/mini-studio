<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Bold Memphis Dot Pattern -->
    <pattern id="memphis-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.4" fill="#1e1e24"/>
    </pattern>
    <!-- Diagonal Stripes Pattern -->
    <pattern id="memphis-stripes" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1e1e24" stroke-width="4.5"/>
    </pattern>
    <!-- Clip Path for Inside the Heart -->
    <clipPath id="heart-clip">
      <path d="M 300,280
               C 270,180 150,180 110,265
               C 70,350 140,450 300,590
               C 460,450 530,350 490,265
               C 450,180 330,180 300,280 Z"/>
    </clipPath>
  </defs>

  <!-- Cream Pastel Background -->
  <rect width="600" height="900" fill="#fdfbf5"/>

  <!-- Background Decorative Geometric Shapes (Memphis Confetti) -->
  <!-- Pastel Mint Quadrant -->
  <path d="M 460,110 A 90,90 0 0,0 370,200 L 460,200 Z" fill="#2ed573" opacity="0.85"/>
  <!-- Lavender Curved Squiggle Ribbon -->
  <path d="M 60,340 Q 95,300 130,340 T 200,340" fill="none" stroke="#70a1ff" stroke-width="8" stroke-linecap="round"/>
  <!-- Lemon Yellow Big Triangle -->
  <polygon points="460,610 540,570 510,660" fill="#ffa502"/>
  <circle cx="515" cy="610" r="12" fill="#fdfbf5"/>
  <!-- Coral Pink Donut Ring -->
  <circle cx="105" cy="620" r="32" fill="none" stroke="#ff4757" stroke-width="8"/>
  <!-- Black Squiggle Line -->
  <path d="M 390,660 Q 420,630 450,660 T 510,660" fill="none" stroke="#1e1e24" stroke-width="5" stroke-linecap="round"/>

  <!-- Floating Memphis Crosses -->
  <g stroke="#1e1e24" stroke-width="4" stroke-linecap="square">
    <path d="M 120,180 L 140,180 M 130,170 L 130,190"/>
    <path d="M 470,390 L 490,390 M 480,380 L 480,400"/>
    <path d="M 285,120 L 305,120 M 295,110 L 295,130"/>
  </g>

  <!-- Main Memphis Heart Object -->
  <!-- Hard Offset Drop Shadow (14px offset) -->
  <path d="M 314,294
           C 284,194 164,194 124,279
           C 84,364 154,464 314,604
           C 474,464 544,364 504,279
           C 464,194 344,194 314,294 Z"
        fill="#1e1e24"/>

  <!-- Primary Heart Interior Group (Clipped) -->
  <g clip-path="url(#heart-clip)">
    <!-- Base Solid Background: Electric Coral Red -->
    <rect x="0" y="0" width="600" height="900" fill="#ff4757"/>

    <!-- Left Flank: Pastel Mint Diagonal Band -->
    <polygon points="50,200 320,200 180,600 50,600" fill="#2ed573"/>

    <!-- Right Flank: Bold Diagonal Stripes Pattern -->
    <polygon points="300,200 550,200 550,600 240,600" fill="url(#memphis-stripes)"/>

    <!-- Upper Center Triangle: Lemon Yellow with Black Dots -->
    <polygon points="210,180 390,180 300,340" fill="#ffa502"/>
    <polygon points="210,180 390,180 300,340" fill="url(#memphis-dots)"/>

    <!-- Internal Divider Dividing Line -->
    <line x1="300" y1="280" x2="300" y2="590" stroke="#1e1e24" stroke-width="6"/>
  </g>

  <!-- Thick Outline for Main Heart -->
  <path d="M 300,280
           C 270,180 150,180 110,265
           C 70,350 140,450 300,590
           C 460,450 530,350 490,265
           C 450,180 330,180 300,280 Z"
        fill="none"
        stroke="#1e1e24"
        stroke-width="6.5"
        stroke-linejoin="round"/>

  <!-- Poster Typography Section -->
  <!-- Top Banner -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900">
    <rect x="50" y="45" width="130" height="26" fill="#1e1e24"/>
    <text x="115" y="62" font-size="11" fill="#fdfbf5" text-anchor="middle" letter-spacing="1">COLLECTION '81</text>
    <text x="550" y="64" font-size="10" fill="#1e1e24" text-anchor="end" letter-spacing="1.5">FORM &amp; PATTERN</text>
  </g>

  <!-- Bottom Pop Block -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Huge Pop Headline with Color Backing Box -->
    <rect x="50" y="742" width="280" height="48" fill="#ffa502"/>
    <text x="65" y="780" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#1e1e24">POP PULSE</text>

    <!-- Subtitle -->
    <text x="50" y="818" font-size="12" font-weight="800" letter-spacing="2" fill="#ff4757">MEMPHIS MILANO POSTMODERN</text>

    <!-- Footer Bar -->
    <line x1="50" y1="835" x2="550" y2="835" stroke="#1e1e24" stroke-width="2"/>
    <text x="50" y="855" font-size="9.5" font-weight="700" letter-spacing="1" fill="#1e1e24">SHAPE: HEART // MOTIF 05</text>
    <text x="550" y="855" font-size="10" font-weight="900" letter-spacing="2" fill="#1e1e24" text-anchor="end">ARTIST: GITSAM</text>
  </g>
</svg>
