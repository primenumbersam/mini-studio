<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <!-- Background Cream Paper -->
  <rect width="600" height="900" fill="#f4efe4"/>

  <!-- Vertical Construction Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="900" stroke="#e0dbcf" stroke-width="0.8"/>
  <line x1="540" y1="0" x2="540" y2="900" stroke="#e0dbcf" stroke-width="0.8"/>

  <!-- Reference Header Mark -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <line x1="504" y1="46" x2="540" y2="46" stroke="#1c1c1c" stroke-width="2"/>
    <text x="540" y="60" font-size="10" font-weight="700" letter-spacing="0.5" fill="#1c1c1c" text-anchor="end">REF. 77</text>
  </g>

  <!-- Blue Rectangular Prismatic Bar -->
  <rect x="210" y="190" width="180" height="50" fill="#29558c"/>

  <!-- Bauhaus Red Semicircular Arc (Constructivist Heart Curvature) -->
  <path d="M 165,435 L 165,480 A 135,135 0 0,0 435,480 L 435,435"
        fill="none"
        stroke="#d02d29"
        stroke-width="32"
        stroke-linecap="butt"/>

  <!-- Solid Black Heavy Balance Beam -->
  <rect x="75" y="535" width="450" height="38" fill="#1c1c1c"/>

  <!-- Primary Yellow Geometric Sphere -->
  <circle cx="450" cy="635" r="38" fill="#f0b126"/>

  <!-- Typography & Poster Meta -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Main Title -->
    <text x="60" y="810" font-size="44" font-weight="900" letter-spacing="-1.2" fill="#1c1c1c">BAUHAUS</text>
    <!-- Subtitle -->
    <text x="60" y="836" font-size="11" font-weight="600" letter-spacing="1.8" fill="#4a4845">SYNTHESIS / VOL. 01</text>
    <!-- Artist Credit -->
    <text x="540" y="836" font-size="10" font-weight="800" letter-spacing="2" fill="#1c1c1c" text-anchor="end">ARTIST: GITSAM</text>
  </g>

  <!-- Outer Poster Border Frame -->
  <rect x="1" y="1" width="598" height="898" fill="none" stroke="#1c1c1c" stroke-width="1.8"/>
</svg>
