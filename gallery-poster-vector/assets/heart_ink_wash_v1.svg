<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Organic Ink Bleed & Paper Dispersion Filter -->
    <filter id="ink-bleed" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="4" seed="42" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="0.4" result="softEdge"/>
      <feMerge>
        <feMergeNode in="softEdge"/>
        <feMergeNode in="SourceGraphic" opacity="0.85"/>
      </feMerge>
    </filter>

    <!-- Subtle Ink Droplet Blur Filter -->
    <filter id="ink-droplet-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- Wabi-sabi Warm Paper Background -->
  <rect width="600" height="900" fill="#f6f4ec"/>

  <!-- Minimal Top Header -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="10" fill="#8a867c">
    <text x="60" y="65">ink &amp; gesture // 02</text>
    <text x="540" y="65" font-family="system-ui, sans-serif" font-style="normal" font-size="9" font-weight="600" letter-spacing="2" text-anchor="end">SHAPE: HEART</text>
    <line x1="60" y1="78" x2="540" y2="78" stroke="#e6e1d5" stroke-width="0.8"/>
  </g>

  <!-- Ambient Ink Mist Droplets -->
  <g fill="#1a1918">
    <circle cx="455" cy="245" r="14" opacity="0.05" filter="url(#ink-droplet-blur)"/>
    <circle cx="470" cy="255" r="10" opacity="0.04" filter="url(#ink-droplet-blur)"/>
    <circle cx="230" cy="515" r="12" opacity="0.04" filter="url(#ink-droplet-blur)"/>
    <circle cx="438" cy="508" r="7" opacity="0.06" filter="url(#ink-droplet-blur)"/>
    <circle cx="434" cy="625" r="9" opacity="0.12" filter="url(#ink-droplet-blur)"/>
  </g>

  <!-- Main Sumi Ink Heart Shape -->
  <g filter="url(#ink-bleed)">
    <!-- Base Heart Silhouette with Jagged Ink Edges -->
    <path d="M 300,295
             C 278,210 160,185 105,255
             C 65,305 70,380 120,455
             C 170,530 250,610 300,670
             C 350,610 430,530 480,455
             C 530,380 535,305 495,255
             C 440,185 322,210 300,295 Z"
          fill="#171615"/>

    <!-- Organic Ink Edge Spikes & Texture -->
    <!-- Left Lobe Spikes -->
    <polygon points="105,255 90,268 115,278" fill="#171615"/>
    <polygon points="85,295 72,310 98,322" fill="#171615"/>
    <polygon points="78,340 68,360 92,370" fill="#171615"/>
    <polygon points="90,390 82,415 110,422" fill="#171615"/>
    <polygon points="120,448 102,465 132,482" fill="#171615"/>
    <polygon points="175,520 160,542 195,548" fill="#171615"/>
    <polygon points="230,580 215,605 250,612" fill="#171615"/>

    <!-- Right Lobe Spikes -->
    <polygon points="495,255 510,268 485,278" fill="#171615"/>
    <polygon points="515,295 528,310 502,322" fill="#171615"/>
    <polygon points="522,340 538,358 508,370" fill="#171615"/>
    <polygon points="510,390 522,412 490,422" fill="#171615"/>
    <polygon points="480,448 498,465 468,482" fill="#171615"/>
    <polygon points="425,520 440,542 405,548" fill="#171615"/>
    <polygon points="370,580 385,605 350,612" fill="#171615"/>

    <!-- Valley Center Dry Brush Bristles -->
    <polygon points="300,295 296,280 304,280" fill="#171615"/>

    <!-- Bottom Tip Bristles / Splatters -->
    <path d="M 295,665 L 297,710 L 301,675 L 303,702 L 306,665 Z" fill="#171615"/>
  </g>

  <!-- Bottom Poster Typography & Inkan Seal -->
  <g>
    <!-- Left Typographic Block -->
    <text x="60" y="810" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" letter-spacing="1" fill="#1a1918">RESONANCE</text>
    <text x="60" y="834" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#58544d">captured moment. v.02</text>
    <text x="60" y="865" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#8a867c">STYLE: SUMI INK WASH  •  ARTIST: GITSAM</text>

    <!-- Red Seal Stamp (낙관 인장) -->
    <g transform="translate(485, 792)">
      <!-- Red Square Seal Frame -->
      <rect x="0" y="0" width="34" height="34" fill="#b82e2c"/>
      <!-- Diagonal Calligraphic Scribing Stroke -->
      <line x1="8" y1="8" x2="26" y2="26" stroke="#f6f4ec" stroke-width="2.2" stroke-linecap="square"/>
    </g>
  </g>
</svg>
