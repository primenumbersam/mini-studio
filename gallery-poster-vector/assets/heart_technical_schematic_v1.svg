<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- 20px Technical Blueprint Grid Pattern -->
    <pattern id="cad-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#132b4f" stroke-width="0.5"/>
    </pattern>
    <!-- 100px Major Subdivision Grid -->
    <pattern id="cad-major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#cad-grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1d4277" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Deep Engineering Blueprint Navy -->
  <rect width="600" height="900" fill="#091830"/>
  <rect width="600" height="900" fill="url(#cad-major-grid)"/>

  <!-- Outer Blueprint Border & Coordinate Rules -->
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#2a5899" stroke-width="1.2"/>
  <rect x="44" y="44" width="512" height="812" fill="none" stroke="#183664" stroke-width="0.6"/>

  <!-- Top Technical Header -->
  <g font-family="'SF Mono', Consolas, Monaco, monospace" font-size="8.5" fill="#7dd3fc" letter-spacing="1">
    <text x="55" y="62">PROJECT: SYST-VECTOR // CAD STUDY</text>
    <text x="300" y="62" text-anchor="middle">DATUM: WGS-84 / ISO 10303</text>
    <text x="545" y="62" text-anchor="end">REV. 04.2B</text>
    <line x1="40" y1="70" x2="560" y2="70" stroke="#2a5899" stroke-width="0.8"/>
  </g>

  <!-- Central Coordinate System Lines -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.6">
    <line x1="300" y1="120" x2="300" y2="680" stroke-dasharray="8,4,2,4"/>
    <line x1="100" y1="360" x2="500" y2="360" stroke-dasharray="8,4,2,4"/>
    <circle cx="300" cy="360" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="300" cy="360" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Main Blueprint Geometry: Heart Contour & Construction -->
  <!-- Radii Guide Circles (Cyan Dashed) -->
  <g stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <circle cx="210" cy="310" r="95"/>
    <circle cx="390" cy="310" r="95"/>
    <!-- Center Construction Crosses -->
    <path d="M 202,310 L 218,310 M 210,302 L 210,318"/>
    <path d="M 382,310 L 398,310 M 390,302 L 390,318"/>
  </g>

  <!-- Tangent Vectors & Angle Rays -->
  <g stroke="#38bdf8" stroke-width="0.9" opacity="0.75">
    <line x1="115" y1="310" x2="300" y2="585"/>
    <line x1="485" y1="310" x2="300" y2="585"/>
    <line x1="210" y1="310" x2="300" y2="245"/>
    <line x1="390" y1="310" x2="300" y2="245"/>
  </g>

  <!-- Precision Solid Heart Curve (Primary White Stroke) -->
  <path d="M 300,245
           A 95,95 0 0,0 115,310
           L 300,585
           L 485,310
           A 95,95 0 0,0 300,245 Z"
        fill="#0284c7"
        fill-opacity="0.12"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Dimension Lines, Arrows & Dimension Texts -->
  <g font-family="'SF Mono', Consolas, Monaco, monospace" font-size="9" fill="#38bdf8">
    <!-- R95 Dimension Callout Left -->
    <line x1="210" y1="310" x2="142.8" y2="242.8" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="142.8,242.8 152,246 146,252" fill="#38bdf8"/>
    <text x="135" y="235" font-weight="600">R 95.00 MM</text>

    <!-- Width Dimension Top -->
    <line x1="115" y1="180" x2="485" y2="180" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="115" y1="172" x2="115" y2="310" stroke="#2a5899" stroke-width="0.6"/>
    <line x1="485" y1="172" x2="485" y2="310" stroke="#2a5899" stroke-width="0.6"/>
    <polygon points="115,180 125,177 125,183" fill="#38bdf8"/>
    <polygon points="485,180 475,177 475,183" fill="#38bdf8"/>
    <text x="300" y="174" text-anchor="middle" font-weight="700">W: 370.00 PT</text>

    <!-- Apex Angle Dimension Bottom -->
    <path d="M 270,542 A 50,50 0 0,0 330,542" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="300" y="530" text-anchor="middle">∠ 64.0°</text>

    <!-- Tip Coordinates Callout -->
    <text x="300" y="612" text-anchor="middle" fill="#ffffff" font-weight="600">[X:300.00, Y:585.00]</text>
  </g>

  <!-- Engineering Title Block (하단 표제란) -->
  <g transform="translate(40, 710)">
    <!-- Title Block Border -->
    <rect x="0" y="0" width="520" height="150" fill="#0c1f3d" stroke="#2a5899" stroke-width="1"/>
    <line x1="0" y1="40" x2="520" y2="40" stroke="#2a5899" stroke-width="0.8"/>
    <line x1="0" y1="95" x2="520" y2="95" stroke="#2a5899" stroke-width="0.8"/>
    <line x1="330" y1="0" x2="330" y2="150" stroke="#2a5899" stroke-width="0.8"/>

    <!-- Left Main Information -->
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">TECHNICAL SCHEMATIC // HEART</text>
    <text x="20" y="65" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#7dd3fc" font-weight="700">TITLE: BIVECTOR VOLUMETRIC BLUEPRINT</text>
    <text x="20" y="82" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#94a3b8">DWG NO: SEC-HT-001 // SCALE 1:1 // UNIT: PT</text>

    <!-- Left Footer Meta -->
    <text x="20" y="118" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#94a3b8">TOLERANCE: ± 0.05 MM</text>
    <text x="20" y="134" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#94a3b8">SYSTEM: NON-RATIONAL B-SPLINE / ARC</text>

    <!-- Right Block: Status & Artist Approval -->
    <text x="350" y="26" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#7dd3fc" font-weight="700">STATUS: APPROVED FOR PROD</text>
    <text x="350" y="65" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">DESIGN CHIEF</text>
    <text x="350" y="85" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.5">GITSAM</text>

    <text x="350" y="125" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#38bdf8">DATE: 2026.10.22</text>
  </g>
</svg>
