<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="900" fill="#f0f2f5"/>

  <!-- Technical Grid & Guide Marks -->
  <g stroke="#d8dde3" stroke-width="0.8" opacity="0.8">
    <line x1="60" y1="80" x2="540" y2="80"/>
    <line x1="60" y1="740" x2="540" y2="740"/>
    <line x1="300" y1="120" x2="300" y2="135"/>
    <line x1="300" y1="715" x2="300" y2="730"/>
    <line x1="292" y1="127.5" x2="308" y2="127.5"/>
  </g>

  <!-- Top Header Metadata -->
  <text x="60" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#5c6470">VECTOR STUDY // 01</text>
  <text x="540" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#7d8794" text-anchor="end">SHAPE: HEART</text>

  <!-- Vertex Coordinate Labels -->
  <text x="180" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7d8794">v.1</text>
  <text x="312" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7d8794">v.end</text>

  <!-- Main Origami Heart Geometry -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left Inner Valley Facet -->
    <polygon points="300,310 185,255 300,370" fill="#d33a36"/>
    <!-- Left Upper Outer Facet -->
    <polygon points="185,255 95,400 300,370" fill="#be292b"/>
    <!-- Left Middle Horizontal Band Facet -->
    <polygon points="95,400 300,455 300,370" fill="#ce3032"/>
    <!-- Left Lower Major Facet -->
    <polygon points="95,400 300,680 300,455" fill="#a12426"/>

    <!-- Right Inner Valley Facet -->
    <polygon points="300,310 415,255 300,370" fill="#b92629"/>
    <!-- Right Upper Outer Facet -->
    <polygon points="415,255 505,400 300,370" fill="#981d20"/>
    <!-- Right Middle Horizontal Band Facet -->
    <polygon points="505,400 300,455 300,370" fill="#84171a"/>
    <!-- Right Lower Major Facet -->
    <polygon points="505,400 300,680 300,455" fill="#6f1315"/>
  </g>

  <!-- Poster Typography Section -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="60" y="802" font-size="32" font-weight="900" letter-spacing="-0.5" fill="#181a1c">TECTONIC PULSE</text>
    <!-- Subtitle -->
    <text x="60" y="826" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5c6470">GEOMETRIC UNFOLDING / SERIES 03</text>

    <!-- Footer Guide & Credits -->
    <line x1="60" y1="845" x2="540" y2="845" stroke="#d8dde3" stroke-width="0.8"/>
    <text x="60" y="865" font-size="9" font-weight="600" letter-spacing="1.2" fill="#7d8794">STYLE: LOW POLY ORIGAMI</text>
    <text x="540" y="865" font-size="9" font-weight="800" letter-spacing="1.5" fill="#181a1c" text-anchor="end">ARTIST: GITSAM</text>
  </g>
</svg>
