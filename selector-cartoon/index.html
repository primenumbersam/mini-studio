<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cartoon Art Style Collection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .perspective-container {
      perspective: 1800px;
      perspective-origin: 10% 10%;
      transition: perspective-origin 0.3s ease;
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    .card-shadow {
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.85);
    }

    .card {
      backface-visibility: hidden;
      will-change: transform, opacity;
    }
  </style>
</head>

<body class="bg-black text-white relative h-screen w-full overflow-hidden">

  <!-- Fixed 3D Viewport -->
  <div id="viewport" class="fixed inset-0 w-full h-screen overflow-hidden flex items-center justify-center">

    <!-- Top Left UI Overlay -->
    <header class="absolute top-4 left-4 sm:top-[3vw] sm:left-[3vw] z-40 pointer-events-none mix-blend-difference">
      <h1 class="font-bold text-xl sm:text-3xl md:text-5xl leading-tight sm:leading-[0.9] tracking-tighter sm:ml-[2vw]">
        Cartoon Art Style
      </h1>
      <h1 class="font-bold text-xl sm:text-3xl md:text-5xl leading-tight sm:leading-[0.9] tracking-tighter">
        COLLECTION
        <span id="collection-count"
          class="text-[0.45em] align-top relative top-[0.4em] ml-1.5 font-mono tabular-nums opacity-80">
          (16)
        </span>
      </h1>
    </header>

    <!-- Bottom Right Hint -->
    <footer
      class="absolute bottom-4 right-4 sm:bottom-[3vw] sm:right-[3vw] z-40 font-mono text-[11px] sm:text-xs tracking-wider uppercase opacity-70 pointer-events-none">
      swipe / scroll to surf · 삼순동순 기술
    </footer>

    <!-- 3D Scene Layer -->
    <div id="scene-container"
      class="absolute inset-0 flex items-center justify-center perspective-container pointer-events-none">
      <div id="card-track" class="relative w-0 h-0 preserve-3d">
        <!-- 16 circular cards dynamically injected here -->
      </div>
    </div>

  </div>

  <!-- Card Detail Modal -->
  <div id="card-modal"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
    <div
      class="relative w-full max-w-lg bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col"
      id="modal-box">
      <button id="modal-close" type="button"
        class="absolute top-3 right-3 sm:top-4 sm:right-4 z-20 w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center border border-white/10 transition-colors cursor-pointer"
        aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="relative w-full h-56 sm:h-72 bg-neutral-950 overflow-hidden flex-shrink-0">
        <img id="modal-image" src="" alt="" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-neutral-900 via-transparent to-transparent"></div>
        <div id="modal-index"
          class="absolute top-3 left-3 sm:top-4 sm:left-4 font-mono text-xs sm:text-sm px-2.5 py-1 rounded bg-black/70 border border-white/10 text-white/90">
          01 / 16
        </div>
      </div>

      <div class="p-5 sm:p-7 space-y-3.5 overflow-y-auto">
        <div>
          <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-400">Style Name</span>
          <h2 id="modal-title" class="text-xl sm:text-2xl font-bold tracking-tight text-white mt-0.5">Pop Art
          </h2>
        </div>

        <div class="pt-2 border-t border-neutral-800">
          <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-400">Representative Example</span>
          <p id="modal-example" class="text-base sm:text-lg font-medium text-neutral-200 mt-0.5">로이 리히텐슈타인</p>
        </div>

        <div
          class="pt-2 border-t border-neutral-800 flex items-center justify-between text-[11px] font-mono text-neutral-500">
          <span id="modal-path" class="truncate mr-2">assets/pop_art.webp</span>
          <span class="flex-shrink-0">Tap outside to close</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FALLBACK_ITEMS = [
      { "name": "Pop Art", "example": "로이 리히텐슈타인", "example_src": "assets/pop_art.webp" },
      { "name": "Superhero Comic", "example": "스파이더맨", "example_src": "assets/superhero_comic.webp" },
      { "name": "Western Comic", "example": "루키 룩", "example_src": "assets/western_comic.webp" },
      { "name": "Franco-Belgian Comic", "example": "틴틴의 모험", "example_src": "assets/franco_belgian_comic.webp" },
      { "name": "Psychedelic Comic", "example": "옐로 서브마린", "example_src": "assets/psychedelic_comic.webp" },
      { "name": "Neon Comic", "example": "아키라", "example_src": "assets/neon_comic.webp" },
      { "name": "Noir Comic", "example": "신 시티", "example_src": "assets/noir_comic.webp" },
      { "name": "Classic Cartoon", "example": "미키 마우스", "example_src": "assets/classic_cartoon.webp" },
      { "name": "Webtoon", "example": "나 혼자만 레벨업", "example_src": "assets/webtoon.webp" },
      { "name": "Anime Manga", "example": "나루토", "example_src": "assets/anime_manga.webp" },
      { "name": "Indie Comic", "example": "블랙홀", "example_src": "assets/indie_comic.webp" },
      { "name": "Graphic Novel", "example": "왓치맨", "example_src": "assets/graphic_novel.webp" },
      { "name": "Minimalist Comic", "example": "찰리 브라운", "example_src": "assets/minimalist_comic.webp" },
      { "name": "Clean Line Art", "example": "도라에몽", "example_src": "assets/clean_line_art.webp" },
      { "name": "Chibi", "example": "포켓몬", "example_src": "assets/chibi.webp" },
      { "name": "Art Nouveau", "example": "아트 누보 삽화", "example_src": "assets/art_nouveau.webp" }
    ];

    function updateCollectionCount(count) {
      const countEl = document.getElementById("collection-count");
      if (countEl) countEl.textContent = `(${count})`;
    }

    async function loadItems() {
      try {
        const response = await fetch("style_art_cartoon.json");
        if (response.ok) {
          const json = await response.json();
          if (Array.isArray(json) && json.length > 0) {
            updateCollectionCount(json.length);
            return json;
          }
        }
      } catch (err) {
        console.warn("Using fallback items due to fetch restriction:", err);
      }
      updateCollectionCount(FALLBACK_ITEMS.length);
      return FALLBACK_ITEMS;
    }

    // Responsive Geometry & Perspective Config
    function getLayoutConfig() {
      const isMobile = window.innerWidth < 768;
      const isSmallMobile = window.innerWidth < 420;

      return {
        isMobile,
        cardWidth: isSmallMobile ? 220 : isMobile ? 240 : 300,
        cardHeight: isSmallMobile ? 300 : isMobile ? 330 : 400,
        anchorX: isSmallMobile ? -45 : isMobile ? -65 : -240, // desktop: moved further left
        anchorY: isSmallMobile ? -85 : isMobile ? -100 : -140, // desktop and mobile: moved further top
        stepX: isSmallMobile ? 135 : isMobile ? 155 : 240,
        stepY: isMobile ? -48 : -84,
        stepZ: isMobile ? -200 : -288,
        rotateY: -20,                                         // desktop and mobile: adjusted to -20deg
        perspectiveOrigin: isMobile ? "35% 20%" : "10% 10%",
        perspective: isMobile ? "1400px" : "2000px"
      };
    }

    async function init() {
      const items = await loadItems();
      const cardTrack = document.getElementById("card-track");
      const sceneContainer = document.getElementById("scene-container");
      const totalCount = items.length;

      let layout = getLayoutConfig();

      // Apply initial perspective styles
      function applyPerspective() {
        layout = getLayoutConfig();
        sceneContainer.style.perspective = layout.perspective;
        sceneContainer.style.perspectiveOrigin = layout.perspectiveOrigin;

        // Update card base dimensions
        cardNodes.forEach((card) => {
          card.style.width = `${layout.cardWidth}px`;
          card.style.height = `${layout.cardHeight}px`;
        });
      }

      let mouseX = -10000;
      let mouseY = -10000;

      // Virtual smooth scroll progress
      let progress = 0;
      let targetProgress = 0;

      const cardNodes = [];
      const cardStates = [];

      // Create 16 circular cards
      items.forEach((item, i) => {
        const padIndex = String(i + 1).padStart(2, "0");

        const card = document.createElement("div");
        card.className = "card absolute bg-neutral-900 overflow-hidden card-shadow group cursor-pointer pointer-events-auto preserve-3d rounded-xl";
        card.style.width = `${layout.cardWidth}px`;
        card.style.height = `${layout.cardHeight}px`;
        card.setAttribute("data-index", i);

        card.innerHTML = `
          <div class="absolute -top-5 -left-3 sm:-top-6 sm:-left-4 text-white font-mono text-xs opacity-50 group-hover:opacity-100 transition-opacity pointer-events-none">
            ${padIndex}
          </div>
          <div class="relative w-full h-full brightness-75 group-hover:brightness-100 transition-all duration-300 pointer-events-none">
            <img src="${item.example_src}" alt="${item.name}" class="w-full h-full object-cover pointer-events-none" loading="lazy" />
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent pointer-events-none"></div>
          <div class="absolute bottom-3 left-3 right-3 sm:bottom-4 sm:left-4 sm:right-4 pointer-events-none text-white">
            <div class="text-[9px] sm:text-[10px] font-mono uppercase tracking-widest text-neutral-400 truncate">${item.example}</div>
            <div class="text-sm sm:text-base font-bold tracking-tight mt-0.5 truncate">${item.name}</div>
          </div>
        `;

        card.addEventListener("click", (e) => {
          e.stopPropagation();
          openModal(item, i, totalCount);
        });

        cardTrack.appendChild(card);
        cardNodes.push(card);
        cardStates.push({ currentScale: 1, currentUplift: 0 });
      });

      applyPerspective();
      window.addEventListener("resize", applyPerspective);

      // Desktop Mouse tracking for magnetic effect
      window.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      window.addEventListener("mouseleave", () => {
        mouseX = -10000;
        mouseY = -10000;
      });

      // Desktop Wheel
      window.addEventListener("wheel", (e) => {
        targetProgress += e.deltaY * 0.0018;
      }, { passive: true });

      // Mobile Touch Swipe with smooth velocity
      let touchStartY = 0;
      let touchStartX = 0;
      let isDragging = false;

      window.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) {
          touchStartY = e.touches[0].clientY;
          touchStartX = e.touches[0].clientX;
          isDragging = true;
        }
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (!isDragging || e.touches.length === 0) return;
        const currentY = e.touches[0].clientY;
        const currentX = e.touches[0].clientX;
        const deltaY = touchStartY - currentY;
        const deltaX = touchStartX - currentX;

        // Support both vertical swipe and horizontal swipe on mobile
        const primaryDelta = Math.abs(deltaY) > Math.abs(deltaX) ? deltaY : deltaX;

        touchStartY = currentY;
        touchStartX = currentX;
        targetProgress += primaryDelta * 0.0035;
      }, { passive: true });

      window.addEventListener("touchend", () => {
        isDragging = false;
      }, { passive: true });

      // Keyboard arrow keys support
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowRight") targetProgress += 0.5;
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") targetProgress -= 0.5;
      });

      // Render Loop
      function render() {
        progress += (targetProgress - progress) * 0.1;

        const { stepX, stepY, stepZ, rotateY, anchorX, anchorY, isMobile } = layout;

        for (let i = 0; i < totalCount; i++) {
          const card = cardNodes[i];
          const state = cardStates[i];

          let offset = ((i - progress) % totalCount + totalCount) % totalCount;
          if (offset > 14.5) {
            offset -= totalCount;
          }

          const isVisible = offset >= -0.7 && offset <= 13;

          if (!isVisible) {
            card.style.display = "none";
            continue;
          }

          card.style.display = "block";
          card.style.zIndex = Math.round(1000 - offset * 50);

          let opacity = 1;
          if (offset < 0) {
            opacity = Math.max(0, 1 + offset / 0.7);
          } else if (offset > 9) {
            opacity = Math.max(0, (13 - offset) / 4);
          }
          card.style.opacity = opacity.toFixed(3);

          const baseX = anchorX + offset * stepX;
          const baseY = anchorY + offset * stepY;
          const baseZ = offset * stepZ;

          let targetScale = 1;
          let targetUplift = 0;

          // Magnetic effect (desktop hover)
          if (!isMobile && mouseX > -5000 && offset >= -0.2 && offset <= 5) {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dist = Math.hypot(mouseX - centerX, mouseY - centerY);

            if (dist < 380) {
              const ratio = 1 - dist / 380;
              targetScale = 1 + ratio * 0.45;
            }
          }

          state.currentScale += (targetScale - state.currentScale) * 0.15;
          state.currentUplift += (targetUplift - state.currentUplift) * 0.15;

          card.style.transform = `translate3d(${baseX.toFixed(1)}px, ${(baseY + state.currentUplift).toFixed(1)}px, ${baseZ.toFixed(1)}px) rotateY(${rotateY}deg) scale(${state.currentScale.toFixed(3)})`;
        }

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    }

    // Modal Operations
    const modal = document.getElementById("card-modal");
    const modalBox = document.getElementById("modal-box");
    const modalImage = document.getElementById("modal-image");
    const modalTitle = document.getElementById("modal-title");
    const modalExample = document.getElementById("modal-example");
    const modalIndex = document.getElementById("modal-index");
    const modalPath = document.getElementById("modal-path");
    const modalClose = document.getElementById("modal-close");

    function openModal(item, index, total) {
      modalImage.src = item.example_src;
      modalImage.alt = item.name;
      modalTitle.textContent = item.name;
      modalExample.textContent = item.example;
      modalIndex.textContent = `${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
      modalPath.textContent = item.example_src;

      modal.classList.remove("opacity-0", "pointer-events-none");
      modalBox.classList.remove("scale-95");
      modalBox.classList.add("scale-100");
    }

    function closeModal() {
      modal.classList.add("opacity-0", "pointer-events-none");
      modalBox.classList.remove("scale-100");
      modalBox.classList.add("scale-95");
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>

</html>
