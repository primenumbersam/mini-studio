<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Rubik's Cube with Auto Solver (Three.js) - Final Improved V3</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            font-family: sans-serif;
            color: white;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="scrambleButton">Scramble (섞기)</button>
        <button id="solveButton" disabled>Solve (맞추기))</button>
        <p id="status">Ready (준비)</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Three.js Setup
        let scene, camera, renderer, controls;
        const rubiksCube = new THREE.Group();
        const minicubes = [];

        // ***** 핵심 개선 사항: 간격 조정 *****
        const MINI_SIZE = 1;      // 미니 큐브 크기
        const CUBE_GAP = 0.05;    // 큐브 간 간격
        const SPACING = MINI_SIZE + CUBE_GAP; // 큐브 중심 간 거리 (1.05)

        const colors = {
            WHITE: 0xffffff, YELLOW: 0xffff00, RED: 0xff0000,
            ORANGE: 0xff8c00, BLUE: 0x0000ff, GREEN: 0x00ff00,
            BLACK: 0x111111 // Inner faces
        };

        // Solver State
        let scrambleMoves = [];
        let isAnimating = false;
        let animationQueue = [];
        const ANIMATION_DURATION = 150; // ms

        init();
        animate();

        function init() {
            // Scene & Renderer
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Camera & Controls
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1; // Damping slightly reduced for faster feel

            // Lights
            scene.add(new THREE.AmbientLight(0xaaaaaa));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(10, 10, 10);
            scene.add(light);

            createRubiksCube();
            scene.add(rubiksCube);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('scrambleButton').addEventListener('click', startScramble);
            document.getElementById('solveButton').addEventListener('click', startSolve);
        }

        function createRubiksCube() {
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        if (x === 0 && y === 0 && z === 0) continue;

                        const materials = [
                            // X+ (Right, Red)
                            x === 1 ? new THREE.MeshPhongMaterial({ color: colors.RED }) : new THREE.MeshBasicMaterial({ color: colors.BLACK }),
                            // X- (Left, Orange)
                            x === -1 ? new THREE.MeshPhongMaterial({ color: colors.ORANGE }) : new THREE.MeshBasicMaterial({ color: colors.BLACK }),
                            // Y+ (Up, White)
                            y === 1 ? new THREE.MeshPhongMaterial({ color: colors.WHITE }) : new THREE.MeshBasicMaterial({ color: colors.BLACK }),
                            // Y- (Down, Yellow)
                            y === -1 ? new THREE.MeshPhongMaterial({ color: colors.YELLOW }) : new THREE.MeshBasicMaterial({ color: colors.BLACK }),
                            // Z+ (Front, Green)
                            z === 1 ? new THREE.MeshPhongMaterial({ color: colors.GREEN }) : new THREE.MeshBasicMaterial({ color: colors.BLACK }),
                            // Z- (Back, Blue)
                            z === -1 ? new THREE.MeshPhongMaterial({ color: colors.BLUE }) : new THREE.MeshBasicMaterial({ color: colors.BLACK })
                        ];

                        const geometry = new THREE.BoxGeometry(MINI_SIZE, MINI_SIZE, MINI_SIZE);
                        const minicube = new THREE.Mesh(geometry, materials);

                        minicube.position.set(x * SPACING, y * SPACING, z * SPACING);
                        // Store initial position for rotation logic
                        minicube.userData = { x, y, z };

                        rubiksCube.add(minicube);
                        minicubes.push(minicube);
                    }
                }
            }
        }

        // Improved helper function to round to the nearest integer for grid snapping
        function roundToGrid(val) {
            // Use a small epsilon to handle floating point errors near 0.5
            return Math.round(val + 1e-6); 
        }

        function rotateFace(axis, layer, direction, saveMove = true, onFinished) {
            if (isAnimating) return;
            isAnimating = true;

            const axisName = axis.toUpperCase();
            const angle = direction * Math.PI / 2;
            const targetQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3().set(
                axisName === 'X' ? 1 : 0,
                axisName === 'Y' ? 1 : 0,
                axisName === 'Z' ? 1 : 0
            ), angle);

            const axisChar = axisName.toLowerCase();

            // 1. Select the cubes belonging to the layer using the logical position
            const cubesToRotate = minicubes.filter(cube => cube.userData[axisChar] === layer);

            // 2. Create a temporary rotation group and move cubes into it
            const rotationGroup = new THREE.Group();
            rubiksCube.add(rotationGroup);
            // Use .attach to move cubes while maintaining their world position
            cubesToRotate.forEach(cube => rotationGroup.attach(cube));

            const initialQuaternion = rotationGroup.quaternion.clone();
            const startTime = Date.now();

            function animateRotation() {
                const elapsed = Date.now() - startTime;
                let progress = Math.min(1, elapsed / ANIMATION_DURATION);

                // Slerp for smooth rotation
                THREE.Quaternion.slerp(initialQuaternion, targetQuaternion, rotationGroup.quaternion, progress);
                
                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    // 3. Finalization: Ensure rotation is exactly 90 degrees
                    rotationGroup.quaternion.copy(targetQuaternion);

                    // 4. Update cube positions and move back to main group
                    cubesToRotate.forEach(cube => {
                        // Move cube back to rubiksCube group (detaching from rotationGroup)
                        rubiksCube.attach(cube);
                        
                        // Recalculate and snap the logical position (userData)
                        const newX = roundToGrid(cube.position.x / SPACING);
                        const newY = roundToGrid(cube.position.y / SPACING);
                        const newZ = roundToGrid(cube.position.z / SPACING);

                        cube.userData.x = newX;
                        cube.userData.y = newY;
                        cube.userData.z = newZ;
                        
                        // Enforce snapped physical position using the calculated logical position
                        cube.position.set(newX * SPACING, newY * SPACING, newZ * SPACING);
                        
                        // Reset local rotation
                        cube.rotation.set(0, 0, 0);
                        cube.updateMatrix();
                    });

                    // Clean up the temporary rotation group
                    rubiksCube.remove(rotationGroup);
                    
                    isAnimating = false;
                    if (saveMove) {
                        scrambleMoves.push({ axis: axisName, layer, direction });
                    }
                    if (onFinished) {
                        onFinished();
                    }
                    processQueue(); // Process next move in queue
                }
            }
            animateRotation();
        }

        // --- Scramble and Solve Logic ---
        
        const simpleMoves = [
            { axis: 'X', layer: 1, direction: 1, symbol: 'R' }, { axis: 'X', layer: 1, direction: -1, symbol: 'R\'' },
            { axis: 'X', layer: -1, direction: -1, symbol: 'L' }, { axis: 'X', layer: -1, direction: 1, symbol: 'L\'' },
            { axis: 'Y', layer: 1, direction: 1, symbol: 'U' }, { axis: 'Y', layer: 1, direction: -1, symbol: 'U\'' },
            { axis: 'Y', layer: -1, direction: -1, symbol: 'D' }, { axis: 'Y', layer: -1, direction: 1, symbol: 'D\'' },
            { axis: 'Z', layer: 1, direction: 1, symbol: 'F' }, { axis: 'Z', layer: 1, direction: -1, symbol: 'F\'' },
            { axis: 'Z', layer: -1, direction: -1, symbol: 'B' }, { axis: 'Z', layer: -1, direction: 1, symbol: 'B\'' }
        ];

        function startScramble() {
            if (isAnimating) return;
            document.getElementById('status').textContent = 'Scrambling...';
            document.getElementById('scrambleButton').disabled = true;
            document.getElementById('solveButton').disabled = true;
            scrambleMoves = [];

            const NUM_SCRAMBLE_MOVES = 25;

            for (let i = 0; i < NUM_SCRAMBLE_MOVES; i++) {
                const randomMove = simpleMoves[Math.floor(Math.random() * simpleMoves.length)];
                animationQueue.push({ axis: randomMove.axis, layer: randomMove.layer, direction: randomMove.direction, save: true });
            }
            
            // Define a completion callback for the entire scramble sequence
            processQueue(() => {
                document.getElementById('status').textContent = `Scrambled. ${scrambleMoves.length} moves recorded.`;
                document.getElementById('scrambleButton').disabled = false;
                document.getElementById('solveButton').disabled = false;
            });
        }

        function startSolve() {
            if (isAnimating || scrambleMoves.length === 0) return;
            document.getElementById('status').textContent = 'Solving...';
            document.getElementById('scrambleButton').disabled = true;
            document.getElementById('solveButton').disabled = true;

            const solveMoves = scrambleMoves.slice().reverse().map(move => {
                return {
                    axis: move.axis,
                    layer: move.layer,
                    direction: -move.direction, // Invert direction
                    save: false
                };
            });

            animationQueue = solveMoves;

            processQueue(() => {
                document.getElementById('status').textContent = 'Solved!';
                scrambleMoves = [];
                document.getElementById('scrambleButton').disabled = false;
                // Solve 버튼은 큐브가 다시 스크램블될 때까지 비활성화 상태를 유지합니다.
                document.getElementById('solveButton').disabled = true;
            });
        }

        let onQueueCompleteCallback = null;
        function processQueue(onComplete = null) {
            if (onComplete) {
                onQueueCompleteCallback = onComplete;
            }

            if (isAnimating) return;

            if (animationQueue.length > 0) {
                const nextMove = animationQueue.shift();
                // rotateFace 함수는 애니메이션 완료 후 isAnimating을 false로 설정하고 processQueue를 호출합니다.
                rotateFace(nextMove.axis, nextMove.layer, nextMove.direction, nextMove.save);
            } else if (onQueueCompleteCallback) {
                onQueueCompleteCallback();
                onQueueCompleteCallback = null;
            }
        }


        // --- Render and Utility Functions ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
